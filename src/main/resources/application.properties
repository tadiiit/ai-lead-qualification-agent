spring.application.name=ai-lead-qualification-agent
server.port=8090

#H2 config

spring.datasource.url=jdbc:h2:file:./data/mydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#Enable the h2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#JPA /Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#gemini
spring.ai.google.genai.chat.model=gemini-3.5-flash

spring.ai.google.genai.api-key=${GEMINI_API_KEY}


#webspot
hubspot.base-url = https://api.hubapi.com/
hubspot.service-key=${HUBSPOT_API_KEY}


#hubspot connect
hubspot.client-id=${HUBSPOT_CLIENT_ID}
hubspot.client-secret=${HUBSPOT_CLIENT_SECRET}
hubspot.redirect-uri=http://localhost:8090/api/integrations/hubspot/callback

#frontend url
frontend.url=${FRONTEND_URL}


#jwt authentication
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000